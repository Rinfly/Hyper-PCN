optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.00005,
  weight_decay : 0
}}

scheduler: {
  type: WarmUpCosLR,
  kwargs: {
  warmup_epoch: 10,
  max_epoch: 100,
  lr_max: 0.00005,
  lr_min: 0.000002, 
}}

dataset : {
  train : { _base_: ./cfgs/dataset_configs/MVP.yaml, 
            others: {subset: 'train'}},
  val : { _base_: ./cfgs/dataset_configs/MVP.yaml, 
            others: {subset: 'test'}},
  test : { _base_: ./cfgs/dataset_configs/MVP.yaml, 
            others: {subset: 'test'}}}
    
model : {
  NAME: Hyper_PCN, 
  up_factors: "1, 2", 
  include_input: False
}

total_bs : 32
step_per_update : 1
max_epoch : 100

consider_metric: CDL2